interface:
  display_name: "Interior Design"
  short_description: "Interior concepts, drawings and contractor coordination"
  default_prompt: "Use $interior-design to develop my interior project from its actual plans, measurements and needs. For contractor discussions, prepare dimensioned drawings, linked specifications, trade interfaces, open decisions and an honest readiness assessment. For quotations, include scope and quantity bases. Distinguish assumed dimensions from verified site evidence and ask for the few missing decisions that affect the next revision. Open the completed delivery in my browser."
