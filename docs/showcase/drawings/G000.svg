<text x="20" y="64" font-family="Arial, sans-serif" font-size="3.2" fill="#243345" text-anchor="start">A coordinated design-development set: shared geometry, dimensioned plans, interior elevations and</text>
<text x="20" y="69.8" font-family="Arial, sans-serif" font-size="3.2" fill="#243345" text-anchor="start">casework interfaces. This study makes design decisions visible before detailed trade coordination.</text>
