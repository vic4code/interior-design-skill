<text x="224" y="181.6" font-family="Arial, sans-serif" font-size="2.7" fill="#243345" text-anchor="start">NTS</text>
<text x="270" y="97" font-family="Arial, sans-serif" font-size="3.6" fill="#986747" text-anchor="start">ISSUE BASIS / S01</text>
<text x="270" y="108" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">Internal room 6000 x 4800 x 2800 mm.</text>
<text x="270" y="118.8" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">Wall thickness 150 mm is an assumed</text>
<text x="270" y="123.6" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">envelope.</text>
<text x="270" y="134.4" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">All opening sizes and locations are design</text>
<text x="270" y="139.20000000000002" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">assumptions; survey before setting out.</text>
<text x="270" y="150.00000000000003" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">Finish study: Mid-century Modern. Geometry</text>
<text x="270" y="154.80000000000004" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">is common to all style variants.</text>
<text x="270" y="165.60000000000005" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">Elevation arrows reference interior views:</text>
<text x="270" y="170.40000000000006" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">south is east-left, north is west-left.</text>
<text x="270" y="181.20000000000007" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">Door hinge and inward swing are proposed.</text>
<text x="270" y="186.00000000000009" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">Nominal 900 leaf is not a certified clear</text>
<text x="270" y="190.8000000000001" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">opening.</text>
<text x="270" y="201.6000000000001" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">Trade release requires the specific</text>
<text x="270" y="206.40000000000012" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">decisions in S001 and hardware review in</text>
<text x="270" y="211.20000000000013" font-family="Arial, sans-serif" font-size="2.9" fill="#243345" text-anchor="start">J401.</text>
